name: Opdater elpriser

on:
  schedule:
    - cron: "7 * * * *"
    - cron: "25,45 11,12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: elpris
  cancel-in-progress: false

jobs:
  opdater:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hent priser, prognose og send alarmer
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CARNOT_APIKEY: ${{ secrets.CARNOT_APIKEY }}
          CARNOT_USERNAME: ${{ secrets.CARNOT_USERNAME }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python scripts/update.py

      - name: Gem nye data
        run: |
          git config user.name "elpris-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json data/state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Ingen ændringer"
          else
            git commit -m "Opdater elpriser"
            git pull --rebase --autostash
            git push
          fi
